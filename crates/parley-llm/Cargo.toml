[package]
name = "parley-llm"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Provider-agnostic LLM layer for Parley: one streaming trait with OpenAI-compatible and Anthropic adapters."
publish = false

[dependencies]
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
