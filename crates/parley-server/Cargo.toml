[package]
name = "parley-server"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Meeting page server for Parley: live transcript over WebSocket, with pause, resume and remove."
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
parley-artifacts = { path = "../parley-artifacts" }
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
futures-util = "0.3"
tokio-tungstenite = "0.30"
