[package]
name = "parley-brain"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Meeting brain for Parley: a rolling transcript and notes (summary plus action items) from any LLM provider."
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
parley-artifacts = { path = "../parley-artifacts" }
parley-llm = { path = "../parley-llm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
